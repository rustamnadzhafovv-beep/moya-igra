<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Камешки: Подземелье</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: #171a24;
    --bg-deep: #0f1119;
    --stone: #262a38;
    --stone-edge: #3a3f52;
    --slot: #12141d;
    --gold: #e0a542;
    --text: #ede6d8;
    --dim: #8892a0;
    --win: #7c9473;
    --lose: #c96a4a;
    --ice: #8fd0e8;
    --wood: #7a5636;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(ellipse at top, var(--bg) 0%, var(--bg-deep) 100%);
    color:var(--text); font-family:var(--sans); user-select:none; overscroll-behavior:none;
  }
  .wrap{ max-width:460px; margin:0 auto; padding:16px 14px 22px; }
  h1{ font-family:var(--serif); font-weight:400; font-size:22px; text-align:center; margin:2px 0 2px; }
  .sub{ text-align:center; font-size:12px; color:var(--dim); margin:0 0 12px; }

  .banner{
    position:relative; background:linear-gradient(180deg, var(--stone), #1c1f2a);
    border:1px solid var(--stone-edge); border-radius:16px;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; margin-bottom:10px;
  }
  .banner-goal{
    display:flex; flex-direction:column; align-items:center; flex:1;
  }
  .banner-goal .num{ font-family:var(--serif); font-size:26px; color:var(--gold); line-height:1; }
  .banner-goal .num.pulse{ animation: pulse 0.35s ease; }
  @keyframes pulse{ 0%{transform:scale(1);} 40%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .banner-goal .cap{ font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:1px; }
  .banner-side{ display:flex; align-items:center; gap:5px; font-size:13px; }
  .banner-side svg{ width:20px; height:20px; }

  .stats{ display:flex; gap:8px; margin-bottom:12px; }
  .stat-box{
    flex:1; background:var(--stone); border:1px solid var(--stone-edge);
    border-radius:12px; padding:7px 8px; text-align:center;
  }
  .stat-box .label{ font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:0.03em; }
  .stat-box .value{ font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }

  .board-frame{
    position:relative; border-radius:16px; overflow:hidden;
    border:1px solid var(--stone-edge); box-shadow:0 10px 28px rgba(0,0,0,0.4);
    background: linear-gradient(180deg, var(--stone) 0%, #1a1d28 100%);
    padding:6px;
  }
  .board{ display:grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr); gap:3px; aspect-ratio:1; width:100%; }
  .cell{
    position:relative; border-radius:8px; background:var(--slot);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .cell.armed-target{ box-shadow: inset 0 0 0 2px var(--gold); }
  .gem{
    width:80%; height:80%; border-radius: 50%;
    box-shadow: inset 0 -4px 5px rgba(0,0,0,0.3), inset 0 3px 3px rgba(255,255,255,0.25), 0 2px 4px rgba(0,0,0,0.35);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease, opacity 0.22s ease;
  }
  .gem.selected{ filter:brightness(1.25); box-shadow:0 0 0 3px var(--gold); transform:scale(0.9); }
  .gem.bump{ animation: bump 0.25s ease; }
  @keyframes bump{ 0%{transform:scale(1);} 50%{transform:scale(1.18);} 100%{transform:scale(1);} }
  .gem.clearing{ transform:scale(0.15); opacity:0; }
  .gem.pop-in{ animation: popin 0.28s ease; }
  @keyframes popin{ 0%{transform:scale(0.3); opacity:0.3;} 100%{transform:scale(1); opacity:1;} }

  .ice-overlay{
    position:absolute; inset:8%; border-radius: 50%;
    background: repeating-linear-gradient(135deg, rgba(143,208,232,0.55) 0 3px, rgba(255,255,255,0.25) 3px 6px);
    border: 2px solid rgba(200,235,245,0.7);
    pointer-events:none; transition: opacity 0.2s ease;
  }
  .ice-overlay.cracked{ opacity:0.45; }
  .crate-box{
    position:absolute; inset:10%; border-radius:5px; background: var(--wood);
    border: 2px solid #4d3520; display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 -3px 3px rgba(0,0,0,0.3); overflow:hidden;
  }
  .crate-box::before, .crate-box::after{
    content:''; position:absolute; top:50%; left:50%; width:140%; height:3px; background:#4d3520;
  }
  .crate-box::before{ transform:translate(-50%,-50%) rotate(35deg); }
  .crate-box::after{ transform:translate(-50%,-50%) rotate(-35deg); }
  .crate-hp{ position:absolute; top:2px; right:3px; display:flex; gap:2px; }
  .crate-hp span{ width:5px; height:5px; border-radius:50%; background:#e0c8a0; }
  .crate-hp span.spent{ background:rgba(224,200,160,0.25); }

  .overlay{
    position:absolute; inset:0; background:rgba(10,12,18,0.87);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px; border-radius:16px; z-index:6;
  }
  .overlay.show{ display:flex; }
  .overlay h2{ font-family:var(--serif); font-weight:400; font-size:21px; margin:0 0 6px; }
  .overlay p{ color:var(--dim); font-size:13px; margin:0 0 16px; }

  .toolbar{ display:flex; gap:8px; margin-top:12px; }
  .tool{
    flex:1; position:relative; background:var(--stone); border:1px solid var(--stone-edge);
    border-radius:14px; padding:10px 6px 8px; text-align:center; cursor:pointer;
  }
  .tool.armed{ box-shadow:0 0 0 2px var(--gold); }
  .tool.disabled{ opacity:0.35; cursor:default; }
  .tool svg{ width:24px; height:24px; }
  .tool .count{
    display:inline-block; margin-top:3px; font-size:11px; background:var(--slot);
    border-radius:8px; padding:1px 7px; color:var(--gold); font-weight:600;
  }
  .tool .count.plus{ color:var(--dim); }

  .btn{ border:none; border-radius:14px; padding:13px 10px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:var(--sans); }
  .btn:active{ transform:scale(0.97); }
  .btn-main{ width:100%; background:var(--gold); color:#241a08; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--stone); border:1px solid var(--stone-edge); color:var(--text);
    padding:11px 16px; border-radius:12px; font-size:13px; opacity:0;
    transition:all 0.3s ease; pointer-events:none; max-width:88%; text-align:center; z-index:10;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Камешки: Подземелье</h1>
  <p class="sub">Собирай ряды, разбивай лёд и ящики, расчисти подземелье</p>

  <div class="banner">
    <div class="banner-side">
      <svg viewBox="0 0 24 24"><path d="M12 3 C9 7 5 8 5 13 a7 7 0 0 0 14 0 C19 8 15 7 12 3Z" fill="var(--ice)"/></svg>
      <span id="obstacleCountLabel">7</span>
    </div>
    <div class="banner-goal">
      <div class="num" id="goalVal">14</div>
      <div class="cap">преград осталось</div>
    </div>
    <div class="banner-side">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="var(--wood)"/></svg>
      <span id="crateCountLabel">3</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box"><div class="label">Очки</div><div class="value" id="scoreVal">0</div></div>
    <div class="stat-box"><div class="label">Ходы</div><div class="value" id="movesVal">20</div></div>
  </div>

  <div class="board-frame">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Готово!</h2>
      <p id="overlayText"></p>
      <button class="btn btn-main" id="btnRestart">Новое подземелье</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="tool" id="toolHammer">
      <svg viewBox="0 0 24 24"><path d="M14 3 l4 4 -3 3 -2-2 -6 6 -3-3 6-6 -2-2 3-3z" fill="var(--gold)"/></svg>
      <div class="count" id="cntHammer">3</div>
    </div>
    <div class="tool" id="toolShuffle">
      <svg viewBox="0 0 24 24"><path d="M4 7h4l3 4 3-4h6M4 17h4l3-4 3 4h6" stroke="var(--gold)" stroke-width="2" fill="none"/></svg>
      <div class="count" id="cntShuffle">2</div>
    </div>
    <div class="tool" id="toolBomb">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="14" r="7" fill="var(--gold)"/><path d="M15 8 l4-4" stroke="var(--gold)" stroke-width="2"/></svg>
      <div class="count" id="cntBomb">1</div>
    </div>
    <div class="tool" id="toolBuy">
      <svg viewBox="0 0 24 24"><path d="M12 2 L14 9 L21 9 L15.5 13 L17.5 20 L12 16 L6.5 20 L8.5 13 L3 9 L10 9 Z" fill="var(--gold)"/></svg>
      <div class="count plus" id="cntBuy">15⭐</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  try{
    if (window.Telegram && window.Telegram.WebApp){
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  }catch(e){}

  var ROWS = 7, COLS = 7;
  var COLORS = ['#c9524a', '#4a7bc9', '#4a9b6e', '#d9a441', '#8b5fbf'];
  var START_MOVES = 20;

  var grid = []; // grid[r][c] = {type:int, obstacle:null|{kind:'ice'|'crate', hp:int}}
  var score = 0;
  var moves = START_MOVES;
  var obstacleTotal = 0;
  var selected = null;
  var busy = false;
  var gameOver = false;
  var armedTool = null; // 'hammer' | 'bomb'
  var toolCounts = { hammer:3, shuffle:2, bomb:1 };

  var boardEl = document.getElementById('board');
  var scoreVal = document.getElementById('scoreVal');
  var movesVal = document.getElementById('movesVal');
  var goalVal = document.getElementById('goalVal');
  var iceLabel = document.getElementById('obstacleCountLabel');
  var crateLabel = document.getElementById('crateCountLabel');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayText = document.getElementById('overlayText');
  var toast = document.getElementById('toast');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 2000);
  }

  function randType(){ return Math.floor(Math.random()*COLORS.length); }
  function idx(r,c){ return r*COLS+c; }

  function buildTypeGrid(){
    var g = [];
    for (var r=0;r<ROWS;r++){
      var row=[];
      for (var c=0;c<COLS;c++){
        var t;
        do{ t = randType(); }
        while(
          (c>=2 && row[c-1]===t && row[c-2]===t) ||
          (r>=2 && g[r-1][c]===t && g[r-2][c]===t)
        );
        row.push(t);
      }
      g.push(row);
    }
    return g;
  }

  function buildGrid(){
    var types = buildTypeGrid();
    var g = [];
    for (var r=0;r<ROWS;r++){
      var row=[];
      for (var c=0;c<COLS;c++) row.push({type:types[r][c], obstacle:null});
      g.push(row);
    }
    var cells = [];
    for (var r2=0;r2<ROWS;r2++) for (var c2=0;c2<COLS;c2++) cells.push([r2,c2]);
    cells.sort(function(){ return Math.random()-0.5; });
    var iceN=4, crateN=3, placed=0, ci=0;
    while (placed<iceN && ci<cells.length){
      var p = cells[ci++]; g[p[0]][p[1]].obstacle = {kind:'ice', hp:2}; placed++;
    }
    var placed2=0;
    while (placed2<crateN && ci<cells.length){
      var p2 = cells[ci++]; g[p2[0]][p2[1]].obstacle = {kind:'crate', hp:2}; placed2++;
    }
    return g;
  }

  function computeObstacleTotal(){
    var total=0, ice=0, crate=0;
    for (var r=0;r<ROWS;r++) for (var c=0;c<COLS;c++){
      var o = grid[r][c].obstacle;
      if (o){ total += o.hp; if (o.kind==='ice') ice+=1; else crate+=1; }
    }
    obstacleTotal = total;
    iceLabel.textContent = ice;
    crateLabel.textContent = crate;
  }

  function findMatches(g){
    var matched = {};
    for (var r=0;r<ROWS;r++){
      var run=1;
      for (var c=1;c<=COLS;c++){
        var blocked = c<COLS && g[r][c].obstacle && g[r][c].obstacle.kind==='crate';
        var blockedPrev = g[r][c-1] && g[r][c-1].obstacle && g[r][c-1].obstacle.kind==='crate';
        if (c<COLS && !blocked && !blockedPrev && g[r][c].type===g[r][c-1].type) run++;
        else { if (run>=3 && !blockedPrev){ for (var k=c-run;k<c;k++) matched[idx(r,k)]=true; } run=1; }
      }
    }
    for (var c2=0;c2<COLS;c2++){
      var run2=1;
      for (var r2=1;r2<=ROWS;r2++){
        var blockedC = r2<ROWS && g[r2][c2].obstacle && g[r2][c2].obstacle.kind==='crate';
        var blockedPrevC = g[r2-1] && g[r2-1][c2].obstacle && g[r2-1][c2].obstacle.kind==='crate';
        if (r2<ROWS && !blockedC && !blockedPrevC && g[r2][c2].type===g[r2-1][c2].type) run2++;
        else { if (run2>=3 && !blockedPrevC){ for (var k2=r2-run2;k2<r2;k2++) matched[idx(k2,c2)]=true; } run2=1; }
      }
    }
    return matched;
  }

  function applyGravity(g){
    for (var c=0;c<COLS;c++){
      var stack = [];
      for (var r=ROWS-1;r>=0;r--){ if (g[r][c] !== null) stack.push(g[r][c]); }
      for (var r2=ROWS-1;r2>=0;r2--){
        g[r2][c] = stack.length ? stack.shift() : {type:randType(), obstacle:null};
      }
    }
    return g;
  }

  function swapCells(g, r1,c1,r2,c2){ var t=g[r1][c1]; g[r1][c1]=g[r2][c2]; g[r2][c2]=t; }

  function isBlockedForSwap(cell){ return cell.obstacle && cell.obstacle.kind==='crate'; }

  function hasValidMove(){
    for (var r=0;r<ROWS;r++) for (var c=0;c<COLS;c++){
      if (isBlockedForSwap(grid[r][c])) continue;
      if (c<COLS-1 && !isBlockedForSwap(grid[r][c+1])){
        swapCells(grid,r,c,r,c+1);
        var m = Object.keys(findMatches(grid)).length>0;
        swapCells(grid,r,c,r,c+1);
        if (m) return true;
      }
      if (r<ROWS-1 && !isBlockedForSwap(grid[r+1][c])){
        swapCells(grid,r,c,r+1,c);
        var m2 = Object.keys(findMatches(grid)).length>0;
        swapCells(grid,r,c,r+1,c);
        if (m2) return true;
      }
    }
    return false;
  }

  var cellEls = [];

  function renderAll(prevGrid){
    boardEl.innerHTML = '';
    cellEls = [];
    for (var r=0;r<ROWS;r++){
      for (var c=0;c<COLS;c++){
        var cell = grid[r][c];
        var cellEl = document.createElement('div');
        cellEl.className = 'cell';
        var gem = document.createElement('div');
        gem.className = 'gem';
        gem.style.background = 'radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), transparent 55%), ' + COLORS[cell.type];
        if (cell.obstacle && cell.obstacle.kind==='crate'){
          gem.style.opacity = '0';
        } else if (prevGrid && (!prevGrid[r][c] || prevGrid[r][c].type !== cell.type)){
          gem.classList.add('pop-in');
        }
        cellEl.appendChild(gem);

        if (cell.obstacle && cell.obstacle.kind==='ice'){
          var ov = document.createElement('div');
          ov.className = 'ice-overlay' + (cell.obstacle.hp<2 ? ' cracked' : '');
          cellEl.appendChild(ov);
        }
        if (cell.obstacle && cell.obstacle.kind==='crate'){
          var box = document.createElement('div');
          box.className = 'crate-box';
          var hp = document.createElement('div');
          hp.className = 'crate-hp';
          for (var h=0;h<2;h++){
            var dot = document.createElement('span');
            if (h >= cell.obstacle.hp) dot.classList.add('spent');
            hp.appendChild(dot);
          }
          box.appendChild(hp);
          cellEl.appendChild(box);
        }

        (function(r,c){ cellEl.addEventListener('click', function(){ onCellClick(r,c); }); })(r,c);
        boardEl.appendChild(cellEl);
        cellEls.push(cellEl);
      }
    }
  }

  function updateStats(){
    scoreVal.textContent = score;
    movesVal.textContent = moves;
    goalVal.textContent = obstacleTotal;
    document.getElementById('cntHammer').textContent = toolCounts.hammer;
    document.getElementById('cntShuffle').textContent = toolCounts.shuffle;
    document.getElementById('cntBomb').textContent = toolCounts.bomb;
    document.getElementById('toolHammer').classList.toggle('disabled', toolCounts.hammer<=0);
    document.getElementById('toolShuffle').classList.toggle('disabled', toolCounts.shuffle<=0);
    document.getElementById('toolBomb').classList.toggle('disabled', toolCounts.bomb<=0);
  }

  function pulseGoal(){
    goalVal.classList.remove('pulse'); void goalVal.offsetWidth; goalVal.classList.add('pulse');
  }

  function damageObstacleAt(r,c){
    var cell = grid[r][c];
    if (!cell || !cell.obstacle) return false;
    cell.obstacle.hp -= 1;
    obstacleTotal -= 1;
    if (cell.obstacle.hp<=0) cell.obstacle = null;
    return true;
  }

  // Core resolution: given a set of matched indices (from swap/find OR power-up),
  // handle ice/normal clearing, crate splash damage, gravity, then chain-check.
  function processClear(matchedIndicesObj, comboLevel){
    var keys = Object.keys(matchedIndicesObj);
    if (keys.length === 0){
      busy = false;
      renderAll();
      checkGameEnd();
      return;
    }
    var toNull = [];
    var scoreGain = 0;
    keys.forEach(function(k){
      var ki = parseInt(k,10);
      var r = Math.floor(ki/COLS), c = ki%COLS;
      var cell = grid[r][c];
      scoreGain += 10*comboLevel;
      if (cell.obstacle && cell.obstacle.kind==='ice'){
        var cleared = damageObstacleAt(r,c);
        if (!cell.obstacle){ toNull.push([r,c]); }
        else { cellEls[ki].querySelector('.gem').classList.add('bump'); }
      } else {
        toNull.push([r,c]);
      }
      var el = cellEls[ki];
      if (el){
        var g = el.querySelector('.gem');
        if (toNull.some(function(p){return p[0]===r && p[1]===c;})) g.classList.add('clearing');
      }
    });
    score += scoreGain;
    pulseGoal();
    updateStats();

    setTimeout(function(){
      // crate splash damage from neighbors of cells that actually cleared
      toNull.forEach(function(p){
        var r=p[0], c=p[1];
        [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(function(n){
          if (n[0]>=0 && n[0]<ROWS && n[1]>=0 && n[1]<COLS){
            var ncell = grid[n[0]][n[1]];
            if (ncell.obstacle && ncell.obstacle.kind==='crate'){ damageObstacleAt(n[0], n[1]); }
          }
        });
      });
      toNull.forEach(function(p){ grid[p[0]][p[1]] = null; });
      var prev = grid.map(function(row){ return row.map(function(cell){ return cell ? {type:cell.type, obstacle:cell.obstacle}: null; }); });
      applyGravity(grid);
      updateStats();
      renderAll(prev);
      setTimeout(function(){
        var next = findMatches(grid);
        processClear(next, comboLevel+1);
      }, 240);
    }, 240);
  }

  function onCellClick(r,c){
    if (busy || gameOver) return;
    var cell = grid[r][c];

    if (armedTool === 'hammer'){
      if (toolCounts.hammer<=0) return;
      toolCounts.hammer -= 1;
      armedTool = null;
      document.getElementById('toolHammer').classList.remove('armed');
      var keys = {}; keys[idx(r,c)] = true;
      busy = true;
      processClear(keys, 1);
      return;
    }
    if (armedTool === 'bomb'){
      if (toolCounts.bomb<=0) return;
      toolCounts.bomb -= 1;
      armedTool = null;
      document.getElementById('toolBomb').classList.remove('armed');
      var keys2 = {};
      for (var dr=-1;dr<=1;dr++) for (var dc=-1;dc<=1;dc++){
        var rr=r+dr, cc=c+dc;
        if (rr>=0 && rr<ROWS && cc>=0 && cc<COLS) keys2[idx(rr,cc)]=true;
      }
      busy = true;
      processClear(keys2, 1);
      return;
    }

    if (isBlockedForSwap(cell)){
      showToast('Ящик нельзя двигать — разбей его матчем рядом');
      return;
    }
    if (!selected){
      selected = {r:r,c:c};
      cellEls[idx(r,c)].querySelector('.gem').classList.add('selected');
      return;
    }
    if (selected.r===r && selected.c===c){
      cellEls[idx(r,c)].querySelector('.gem').classList.remove('selected');
      selected = null;
      return;
    }
    var isAdj = (Math.abs(selected.r-r)+Math.abs(selected.c-c))===1;
    cellEls[idx(selected.r,selected.c)].querySelector('.gem').classList.remove('selected');
    if (!isAdj){
      if (isBlockedForSwap(cell)){ selected=null; return; }
      selected = {r:r,c:c};
      cellEls[idx(r,c)].querySelector('.gem').classList.add('selected');
      return;
    }
    var s = selected; selected = null;
    attemptSwap(s.r, s.c, r, c);
  }

  function attemptSwap(r1,c1,r2,c2){
    if (isBlockedForSwap(grid[r1][c1]) || isBlockedForSwap(grid[r2][c2])) return;
    busy = true;
    swapCells(grid, r1,c1,r2,c2);
    var matches = findMatches(grid);
    if (Object.keys(matches).length === 0){
      cellEls[idx(r1,c1)].querySelector('.gem').classList.add('bump');
      cellEls[idx(r2,c2)].querySelector('.gem').classList.add('bump');
      swapCells(grid, r1,c1,r2,c2);
      renderAll();
      setTimeout(function(){ busy=false; }, 200);
      return;
    }
    moves -= 1;
    updateStats();
    renderAll();
    processClear(matches, 1);
  }

  function checkGameEnd(){
    if (obstacleTotal <= 0){
      gameOver = true;
      overlayTitle.textContent = 'Подземелье расчищено! 🏆';
      overlayText.textContent = 'Очки: ' + score + '. Все преграды сняты за ' + (START_MOVES - moves) + ' ходов.';
      overlay.classList.add('show');
      return;
    }
    if (moves <= 0){
      gameOver = true;
      overlayTitle.textContent = 'Ходы закончились';
      overlayText.textContent = 'Осталось преград: ' + obstacleTotal + '. Попробуй ещё раз!';
      overlay.classList.add('show');
      return;
    }
    if (!hasValidMove()){
      showToast('Нет доступных ходов — подземелье перемешивается!');
      shuffleTypesOnly();
    }
  }

  function shuffleTypesOnly(){
    var types = [];
    for (var r=0;r<ROWS;r++) for (var c=0;c<COLS;c++) types.push(grid[r][c].type);
    types.sort(function(){ return Math.random()-0.5; });
    var i=0;
    for (var r2=0;r2<ROWS;r2++) for (var c2=0;c2<COLS;c2++){ grid[r2][c2].type = types[i++]; }
    renderAll();
    if (!hasValidMove()) shuffleTypesOnly();
  }

  document.getElementById('toolHammer').addEventListener('click', function(){
    if (toolCounts.hammer<=0 || busy || gameOver) return;
    armedTool = (armedTool==='hammer') ? null : 'hammer';
    document.getElementById('toolHammer').classList.toggle('armed', armedTool==='hammer');
    document.getElementById('toolBomb').classList.remove('armed');
    if (armedTool==='hammer') showToast('Молот выбран — коснись камешка или преграды');
  });
  document.getElementById('toolBomb').addEventListener('click', function(){
    if (toolCounts.bomb<=0 || busy || gameOver) return;
    armedTool = (armedTool==='bomb') ? null : 'bomb';
    document.getElementById('toolBomb').classList.toggle('armed', armedTool==='bomb');
    document.getElementById('toolHammer').classList.remove('armed');
    if (armedTool==='bomb') showToast('Бомба выбрана — коснись центра области 3×3');
  });
  document.getElementById('toolShuffle').addEventListener('click', function(){
    if (toolCounts.shuffle<=0 || busy || gameOver) return;
    toolCounts.shuffle -= 1;
    updateStats();
    shuffleTypesOnly();
    showToast('Камешки перемешаны');
  });
  document.getElementById('toolBuy').addEventListener('click', function(){
    try{
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openInvoice){
        showToast('Демо: в реальной игре здесь откроется оплата Telegram Stars');
        return;
      }
    }catch(e){}
    showToast('Демо-кнопка: здесь будет покупка инструментов за Telegram Stars');
  });

  document.getElementById('btnRestart').addEventListener('click', newGame);

  function newGame(){
    score = 0; moves = START_MOVES; gameOver = false; selected = null; busy = false; armedTool = null;
    toolCounts = { hammer:3, shuffle:2, bomb:1 };
    overlay.classList.remove('show');
    grid = buildGrid();
    computeObstacleTotal();
    while (!hasValidMove()){ grid = buildGrid(); computeObstacleTotal(); }
    renderAll();
    updateStats();
  }

  newGame();
})();
</script>
</body>
</html>
